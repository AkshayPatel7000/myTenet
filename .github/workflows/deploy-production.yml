name: Deploy Android to Google Play Store Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store Track (production, beta, alpha, internal)'
        required: true
        default: 'production'

jobs:
  deploy:
    name: Build & Deploy to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - name: Restore Google Services JSON
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            if [[ "$GOOGLE_SERVICES_JSON_BASE64" =~ ^\{ ]]; then
              echo "$GOOGLE_SERVICES_JSON_BASE64" > android/app/google-services.json
            else
              echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            fi
          fi

      - name: Restore Android Keystore File
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/my-upload-key.keystore

      - name: Restore Play Store API Key
        env:
          PLAY_STORE_JSON_KEY_BASE64: ${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}
        run: |
          if [ -z "$PLAY_STORE_JSON_KEY_BASE64" ]; then
            echo "::error::GitHub Secret PLAY_STORE_JSON_KEY_BASE64 is missing or empty! Please add it in Repo Settings -> Secrets -> Actions."
            exit 1
          fi
          if [[ "$PLAY_STORE_JSON_KEY_BASE64" =~ ^\{ ]]; then
            echo "$PLAY_STORE_JSON_KEY_BASE64" > pc-api-key.json
            echo "$PLAY_STORE_JSON_KEY_BASE64" > android/pc-api-key.json
          else
            echo "$PLAY_STORE_JSON_KEY_BASE64" | base64 --decode > pc-api-key.json
            echo "$PLAY_STORE_JSON_KEY_BASE64" | base64 --decode > android/pc-api-key.json
          fi

      - name: Run Fastlane Deployment
        env:
          MYAPP_UPLOAD_STORE_FILE: "my-upload-key.keystore"
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY_PATH: "android/pc-api-key.json"
        run: |
          cd android
          bundle exec fastlane deploy
